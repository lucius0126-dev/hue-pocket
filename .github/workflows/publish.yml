name: Publish Hue Pocket and refresh colour news
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'

permissions:
  contents: read

concurrency:
  group: hue-pocket-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build site and refresh public colour headlines
        run: python3 scripts/build_site.py --previous-url https://color.bidezato.com/trend-news.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
